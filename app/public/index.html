<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shin</title>
<meta name="description" content="Point at a thing. Shin tells you whether the price is fair.">
<meta name="theme-color" content="#0B0C0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Three faces, three jobs. Bricolage Grotesque carries the numerals and the
  verdict word, Instrument Sans carries every piece of interface text, IBM Plex
  Mono carries provenance and nothing else. Newsreader is gone: a serif reads as
  an article, and three paragraphs of serif above the fold is what the old
  verdict screen did wrong.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/shell.css">
<link rel="stylesheet" href="/css/face.css">
<link rel="stylesheet" href="/css/screens.css">
</head>
<body>
  <!--
    No app bar and no tab bar. The camera reaches every edge, and the wordmark
    and the three navigation targets live inside the camera surface itself.
  -->
  <div class="device">
    <main id="screen" role="main"></main>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
