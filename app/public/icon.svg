<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Shin">
<!--
  The home screen icon, the browser tab favicon and the manifest icon: one file,
  because they are the same mark at different sizes and an SVG does not care
  which.

  Shin's own character, not a new one. The face below is lifted VERBATIM from
  public/faces/deadpan/pleased.svg, which scripts/build-faces.mjs writes from
  public/js/face-art.js. It is nested in its own 0 0 88 88 viewBox so it can be
  re-pasted from that file without touching a coordinate. Do not restyle it
  here; change face-art.js, re-run `npm run faces`, and paste again.

  `pleased` rather than `idle`: an icon is greeting somebody, and the flat idle
  mouth reads as indifference at 48 pixels.

  NOTE ON THIS COMMENT: an SVG is XML, and a double hyphen is illegal inside an
  XML comment. This file carried three of them (two CSS token names and one
  dash, all in the house style used everywhere else in the repo) and Chrome
  refused to parse the whole file: "Double hyphen within comment", so the
  favicon, the manifest icon and every rasteriser saw nothing at all. Token
  names are written without their leading hyphens below for that reason, and
  the prose uses a semicolon where it wants a dash. This is the one file type
  in the repo where that style is a syntax error.

  Ground is the dark value of the ground token. tokens.css says dark is the
  design and light the accommodation, and an icon does not get to follow the
  system theme; it is one image, so it is the design.

  Geometry is maskable-safe, which is why the face is 62% of the canvas rather
  than full bleed. Android masks this to a circle, a squircle or a rounded
  square depending on the launcher, and only the central circle of radius 40%
  (205px here) survives every one of them. Everything drawn: the face disc
  reaches r=147 and the brand ring r=178, both inside 205. The hat's antenna is
  the outermost point at 140 from centre. So the manifest can honestly declare
  `any maskable` off one file.

  The pink is the brand token. That is allowed and deliberate: brand pink is Shin's
  identity, the wordmark and the shutter ring, and this ring is the shutter. The
  rule it must not break is that pink is never a verdict, and an icon is not a
  verdict surface.
-->
  <rect width="512" height="512" fill="#0B0C0E"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#E5165E" stroke-width="9"/>
  <svg viewBox="0 0 88 88" x="96" y="96" width="320" height="320" color="#12233A">
    <circle class="face-disc" cx="44" cy="44" r="40.5" fill="#DDF1FA"/>
    <g class="face-body">
      <path d="M32 67 C27 70 22 73 19.2 76 A40.5 40.5 0 0 0 68.8 76 C66 73 61 70 56 67 Z" fill="#2BB5F0" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <path d="M38.5 70 L41 77 M49.5 70 L47 77" stroke="currentColor" stroke-width="4.6" stroke-linecap="round" fill="none"/>
      <path d="M38.5 70 L41 77 M49.5 70 L47 77" stroke="#F26B1D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <rect x="38.5" y="75.5" width="11" height="7" rx="1.5" fill="#FFFFFF" stroke="currentColor" stroke-width="2"/>
      <path d="M40.6 77.5 h1.3 v3 h-1.3 Z M43 77.5 h1.3 v3 h-1.3 Z M45.4 77.5 h1.3 v3 h-1.3 Z" fill="#12233A"/>
    </g>
    <g class="face-head">
      <path class="face-skull" d="M44 17 C59 17 68 30 68 46 C68 61 57 70 44 70 C31 70 20 61 20 46 C20 30 29 17 44 17 Z" fill="#2BB5F0" stroke="currentColor" stroke-width="3"/>
      <g class="face-hat">
        <path d="M24 29.5 C26 19 35 14.5 44 14.5 C53 14.5 62 19 64 29.5 C57 27 31 27 24 29.5 Z" fill="#F26B1D" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        <path d="M44 14.5 L44 10.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <g>
          <path d="M34.5 9.5 Q44 5.5 53.5 9.5 Q44 13.5 34.5 9.5 Z" fill="#F26B1D" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="44" cy="9.5" r="1.5" fill="currentColor"/>
        </g>
      </g>
      <g class="face-brows"><path d="M26 32.5 L40 32 M48 32 L62 32.5" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" fill="none"/></g>
      <g class="face-eyes"><path d="M26.5 48 Q33.5 40 40.5 48" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" fill="none"/>
      <path d="M47.5 48 Q54.5 40 61.5 48" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" fill="none"/></g>
      <g class="face-mouth">
      <path d="M38 62 Q44 65.2 50 62" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" fill="none"/></g>
    </g>
    <g class="face-extras"></g>
    <circle class="face-ring" cx="44" cy="44" r="40.5" fill="none" stroke="currentColor" stroke-width="3"/>
  </svg>
</svg>
