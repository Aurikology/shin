<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mascot dev harness</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0B0C0E;
    color: #F7F5F2;
    font-family: 'Courier New', monospace;
    padding: 16px 16px 80px;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.sub { color: #A5ADB8; font-size: 12px; margin: 0 0 16px; }
  .controls {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    background: #16181C;
    border: 2px solid #2E333A;
    padding: 10px;
    margin-bottom: 20px;
  }
  .controls button {
    font-family: inherit;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: #22262C;
    color: #F7F5F2;
    border: 2px solid #2E333A;
    padding: 8px 12px;
    cursor: pointer;
  }
  .controls button:active { transform: translateY(1px); }
  @media (prefers-reduced-motion: reduce) {
    .controls button:active { transform: none; }
  }
  .hue-swatch {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid #2E333A;
    vertical-align: middle;
    margin-right: 6px;
    cursor: pointer;
  }
  .personality-block { margin-bottom: 36px; }
  .personality-title {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 2px solid #2E333A;
    padding-bottom: 6px;
    margin-bottom: 12px;
  }
  .size-row { margin-bottom: 16px; }
  .size-label { font-size: 11px; color: #6E7783; margin-bottom: 8px; text-transform: uppercase; }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: #16181C;
    border: 2px solid #2E333A;
    padding: 8px;
    width: 108px;
  }
  .cell canvas { background: #0B0C0E; }
  .cell .name { font-size: 10px; color: #A5ADB8; text-transform: uppercase; text-align: center; }
</style>
</head>
<body>
  <h1>MASCOT DEV HARNESS</h1>
  <p class="sub">All 13 states, 96px and 28px, all three personalities. Buttons act on every face on the page.</p>

  <div class="controls">
    <button id="btn-blink">BLINK</button>
    <button id="btn-slowblink">SLOW BLINK</button>
    <button id="btn-nod">NOD</button>
    <button id="btn-poke">POKE</button>
    <button id="btn-intense">INTENSE</button>
    <span><span class="hue-swatch" data-hue="#7FD1FF" style="background:#7FD1FF"></span>
    <span class="hue-swatch" data-hue="#38E08B" style="background:#38E08B"></span>
    <span class="hue-swatch" data-hue="#FFC24D" style="background:#FFC24D"></span>
    <span class="hue-swatch" data-hue="#FF6A45" style="background:#FF6A45"></span>
    <span class="hue-swatch" data-hue="#93A0AC" style="background:#93A0AC"></span></span>
  </div>

  <div id="root"></div>

  <script type="module">
    import { createMascot } from '/src/mascot/mascot.js'

    const STATES = [
      'idle', 'thinking', 'asking', 'good', 'delighted', 'fair',
      'walk', 'angry', 'unknown', 'pleased', 'nudging', 'asleep', 'proud',
    ]
    const PERSONALITIES = ['deadpan', 'warm', 'blunt']
    const SIZES = [96, 28]

    const root = document.getElementById('root')
    const instances = [] // { mascot, state }

    for (const personality of PERSONALITIES) {
      const block = document.createElement('div')
      block.className = 'personality-block'
      const title = document.createElement('div')
      title.className = 'personality-title'
      title.textContent = personality
      block.appendChild(title)

      for (const size of SIZES) {
        const row = document.createElement('div')
        row.className = 'size-row'
        const label = document.createElement('div')
        label.className = 'size-label'
        label.textContent = `${size}px`
        row.appendChild(label)

        const grid = document.createElement('div')
        grid.className = 'grid'
        for (const state of STATES) {
          const cell = document.createElement('div')
          cell.className = 'cell'
          const m = createMascot({ size, personality, hue: '#7FD1FF', state })
          m.el.title = `${personality} / ${size}px / ${state}`
          m.el.addEventListener('click', () => m.poke())
          const name = document.createElement('div')
          name.className = 'name'
          name.textContent = state
          cell.appendChild(m.el)
          cell.appendChild(name)
          grid.appendChild(cell)
          instances.push({ mascot: m, state })
        }
        row.appendChild(grid)
        block.appendChild(row)
      }
      root.appendChild(block)
    }

    document.getElementById('btn-blink').onclick = () => instances.forEach(({ mascot }) => mascot.blink())
    document.getElementById('btn-slowblink').onclick = () => instances.forEach(({ mascot }) => mascot.slowBlink())
    document.getElementById('btn-nod').onclick = () => instances.forEach(({ mascot }) => mascot.nod())
    document.getElementById('btn-poke').onclick = () => instances.forEach(({ mascot }) => mascot.poke())
    document.getElementById('btn-intense').onclick = () =>
      instances.forEach(({ mascot, state }) => mascot.setState(state, { intense: true }))

    document.querySelectorAll('.hue-swatch').forEach((sw) => {
      sw.onclick = () => {
        const hue = sw.dataset.hue
        instances.forEach(({ mascot }) => mascot.setHue(hue))
      }
    })
  </script>
</body>
</html>
