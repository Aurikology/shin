# linux/logrotate.conf -- run daily 05:00 by pexi-logrotate.service (launchd twin: com.shin.logrotate).
# The server's own output goes to journald (capped at 500 MB and 14 days by linux/provision.sh), so only the
# files the server appends to inside the data folder need rotating. copytruncate: the server keeps the file
# open, same trade-off as mac/16-rotate-logs.sh (a few milliseconds of lines can be lost).
# Runs as the pexi user, which owns these files, so no `su` line is needed.

/var/lib/pexi/access.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
}

/var/log/pexi/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
}
